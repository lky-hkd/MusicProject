# =====================================================================
# 公共配置（所有环境共享）
# 环境相关配置见 application-dev.yml / application-prod.yml
# 通过 --spring.profiles.active=dev|prod 或环境变量 SPRING_PROFILES_ACTIVE 指定，默认 dev
# =====================================================================
server:
  port: 8080

spring:
  application:
    name: MusicPlatform
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  web:
    resources:
      cache:
        period: 3600   # 静态资源缓存 1 小时（秒）
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

# MyBatis-Plus 公共配置（SQL 日志级别在各环境覆盖）
mybatis-plus:
  mapper-locations: classpath:mybatis/*.xml
  type-aliases-package: com.music.entity
  configuration:
    map-underscore-to-camel-case: true

# Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

# 业务相关公共配置（与环境无关；密钥类放各环境文件）
app:
  upload:
    dir: ${UPLOAD_DIR:uploads}
  seckill:
    hot-product-qps: ${SECKILL_HOT_QPS:20}
    hot-product-window-seconds: ${SECKILL_HOT_WINDOW:3}
  moderation:
    # 是否启用模型复核；false 时可疑词只记日志并放行
    enabled: ${MODERATION_ENABLED:true}
    # OpenAI 兼容接口（Ollama / LM Studio / vLLM）
    endpoint: ${MODERATION_ENDPOINT:http://127.0.0.1:11434/v1/chat/completions}
    # 换成你本地实际的模型名
    model: ${MODERATION_MODEL:rafunga/qwen3guard-gen:4b}
    api-key: ${MODERATION_API_KEY:}
    timeout-ms: ${MODERATION_TIMEOUT_MS:3000}
    # json=通用指令模型（按提示词输出 JSON）；guard=Qwen3Guard-Gen（Safety/Unsafe/Controversial）
    response-format: ${MODERATION_RESPONSE_FORMAT:guard}
    # 模型常驻时长，避免 60 秒冷加载；vLLM 等非 Ollama 后端会跳过预热
    keep-alive: ${MODERATION_KEEP_ALIVE:24h}
    warmup-enabled: ${MODERATION_WARMUP_ENABLED:true}
    # 审计保留天数，<=0 表示不自动清理
    audit-retention-days: ${MODERATION_AUDIT_RETENTION_DAYS:90}
    # 模型判定 block 的最低置信度，低于该值降为 REVIEW
    block-confidence: ${MODERATION_BLOCK_CONFIDENCE:0.75}
    # 无命中内容的异步抽检比例（0 表示关闭）
    sample-rate: ${MODERATION_SAMPLE_RATE:0.03}
    # 短于该长度的内容不参与抽检
    sample-min-length: ${MODERATION_SAMPLE_MIN_LENGTH:10}
  cookie:
    secure: ${COOKIE_SECURE:false}
    http-only: true
    max-age-days: 7